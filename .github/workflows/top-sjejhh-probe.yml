name: TOP SJE.JHH Selective Asset Probe (Windows x86)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/top-sjejhh-selected-assets-20261118
    paths:
      - "tools/TopSjeJhhProbe/**"
      - ".github/workflows/top-sjejhh-probe.yml"

permissions:
  contents: read

jobs:
  build-windows-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x86
        run: cmake -S tools/TopSjeJhhProbe -B build/TopSjeJhhProbe -A Win32

      - name: Build Release
        run: cmake --build build/TopSjeJhhProbe --config Release --parallel

      - name: Run SJE.JHH parser and decrypt self-test
        run: ctest --test-dir build/TopSjeJhhProbe -C Release --output-on-failure

      - name: Validate against TOP reference SJE.JHH fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'SJE.JHH-config'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/BSoD-Ultimate/SjeJhhUtil/master/SjeJhhUtilTest/testdata/SJE.JHH-config' -OutFile $fixture
          & build/TopSjeJhhProbe/Release/TopSjeJhhProbe.exe --validate-archive $fixture
          if ($LASTEXITCODE -ne 0) { throw "TOP reference SJE.JHH validation failed" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item build/TopSjeJhhProbe/Release/TopSjeJhhProbe.exe staging/
          Copy-Item tools/TopSjeJhhProbe/README.md staging/
          Compress-Archive -Path staging/* -DestinationPath TopSjeJhhProbe-Windows-x86.zip -Force

      - name: Verify x86 package
        shell: pwsh
        run: |
          if (!(Test-Path staging/TopSjeJhhProbe.exe)) { throw "EXE missing" }
          $bytes = [System.IO.File]::ReadAllBytes("staging/TopSjeJhhProbe.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid PE DOS signature" }
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($bytes[$pe] -ne 0x50 -or $bytes[$pe + 1] -ne 0x45 -or $bytes[$pe + 2] -ne 0 -or $bytes[$pe + 3] -ne 0) {
            throw "Invalid PE signature"
          }
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x14c) { throw ("Expected x86 IMAGE_FILE_MACHINE_I386, got 0x{0:X}" -f $machine) }
          Get-FileHash staging/TopSjeJhhProbe.exe -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopSjeJhhProbe-Windows-x86
          path: TopSjeJhhProbe-Windows-x86.zip
          if-no-files-found: error
