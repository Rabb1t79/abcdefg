name: nte-vehicle

on:
  push:
    branches:
      - '**'
    paths:
      - 'plugins/NteVehicle/**'
      - 'include/anomaly/**'
      - '.github/workflows/nte-vehicle.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure NTE Vehicle
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $b = "$env:GITHUB_WORKSPACE\.build\nte-vehicle"
          $src = "$env:GITHUB_WORKSPACE\.build\nte-vehicle-src"
          New-Item -ItemType Directory -Force $src | Out-Null
          $cmake = @'
          cmake_minimum_required(VERSION 3.22)
          project(NteVehicleStandalone LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_library(nte_vehicle SHARED
            "@ROOT@/plugins/NteVehicle/plugin.cpp"
            "@ROOT@/plugins/NteVehicle/native_access.cpp"
            "@ROOT@/plugins/NteVehicle/runtime.cpp")
          target_include_directories(nte_vehicle PRIVATE
            "@ROOT@/include"
            "@ROOT@/plugins/NteVehicle")
          target_compile_definitions(nte_vehicle PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
          target_compile_options(nte_vehicle PRIVATE /utf-8 /EHsc)
          set_target_properties(nte_vehicle PROPERTIES OUTPUT_NAME "plugin" PREFIX "")
          '@
          $cmake = $cmake.Replace('@ROOT@', $root)
          Set-Content -LiteralPath "$src\CMakeLists.txt" -Value $cmake -Encoding UTF8
          cmake -S $src -B $b -G "Visual Studio 17 2022" -A x64

      - name: Build NTE Vehicle
        shell: pwsh
        run: |
          $b = "$env:GITHUB_WORKSPACE\.build\nte-vehicle"
          $out = "$env:GITHUB_WORKSPACE\dist\NteVehicle"
          New-Item -ItemType Directory -Force $out | Out-Null
          cmake --build $b --config Release --parallel
          Copy-Item "$b\Release\plugin.dll" "$out\plugin.dll"
          Copy-Item "$env:GITHUB_WORKSPACE\plugins\NteVehicle\manifest.json" "$out\manifest.json"
          Copy-Item "$env:GITHUB_WORKSPACE\plugins\NteVehicle\profile" "$out\profile" -Recurse
          Copy-Item "$env:GITHUB_WORKSPACE\plugins\NteVehicle\locales" "$out\locales" -Recurse
          Compress-Archive -Path "$out\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\NteVehicle-windows-x64.zip" -Force

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NteVehicle-windows-x64
          path: dist/NteVehicle-windows-x64.zip
          if-no-files-found: error
