name: Tetris Vision Pilot - Windows

concurrency:
  group: tetris-vision-pilot-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feat/tetris-vision-pilot-20261108
      - feat/tetris-score-sprite-recognition-20261110
      - feat/tetris-calibration-and-exhaustive-20261110
    paths:
      - "tools/TetrisVisionPilot/**"
      - ".github/workflows/tetris-vision-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tesseract OCR (static x64)
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install tesseract:x64-windows-static

      - name: Download English OCR model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/TetrisVisionPilot/tessdata | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata" -OutFile "tools/TetrisVisionPilot/tessdata/eng.traineddata"

      - name: Configure
        shell: pwsh
        run: cmake -S tools/TetrisVisionPilot -B build/tetris-vision-pilot -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        run: cmake --build build/tetris-vision-pilot --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build/tetris-vision-pilot/Release/TetrisVisionPilot.exe"
          if (!(Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TetrisVisionPilot-Windows-x64
          if-no-files-found: error
          path: |
            build/tetris-vision-pilot/Release/TetrisVisionPilot.exe
            tools/TetrisVisionPilot/README.md
            tools/TetrisVisionPilot/LEARNING_GUIDE.md
            build/tetris-vision-pilot/Release/tessdata/eng.traineddata
