name: TOP CHS_05 Runtime Probe (Windows x86)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/top-chs05-runtime-probe-20261118
    paths:
      - "tools/TopRuntimeProbe/**"
      - ".github/workflows/top-runtime-probe.yml"

permissions:
  contents: read

jobs:
  build-windows-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Win32
        run: cmake -S tools/TopRuntimeProbe -B build/TopRuntimeProbe -A Win32

      - name: Build Release
        run: cmake --build build/TopRuntimeProbe --config Release --parallel

      - name: Run decoder self-test
        run: ctest --test-dir build/TopRuntimeProbe -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item build/TopRuntimeProbe/Release/TopRuntimeProbe.exe staging/
          Copy-Item tools/TopRuntimeProbe/README.md staging/
          Compress-Archive -Path staging/* -DestinationPath TopRuntimeProbe-Windows-x86.zip -Force

      - name: Verify x86 package
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("staging/TopRuntimeProbe.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid PE DOS signature" }
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($bytes[$pe] -ne 0x50 -or $bytes[$pe + 1] -ne 0x45 -or $bytes[$pe + 2] -ne 0 -or $bytes[$pe + 3] -ne 0) {
            throw "Invalid PE signature"
          }
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x14c) { throw ("Expected x86 IMAGE_FILE_MACHINE_I386, got 0x{0:X}" -f $machine) }
          Get-FileHash staging/TopRuntimeProbe.exe -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopRuntimeProbe-Windows-x86
          path: TopRuntimeProbe-Windows-x86.zip
          if-no-files-found: error
